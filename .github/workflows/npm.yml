name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify npm package
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package-version.outputs.version }}
      version-published: ${{ steps.npm-version.outputs.published }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Run smoke test
        run: npm run smoke

      - name: Check package contents
        run: npm pack --dry-run

      - name: Read package version
        id: package-version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check npm version
        id: npm-version
        run: |
          if npm view "agent-roles@${{ steps.package-version.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "agent-roles@${{ steps.package-version.outputs.version }} already exists on npm; publish will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    if: needs.verify.outputs.version-published != 'true'
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish package
        run: npm publish
